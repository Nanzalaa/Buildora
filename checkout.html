<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Nanzalaa">
  <title>Checkout - Buildora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section container" id="checkout-page">
    <h1 class="section-title">Checkout</h1>
    <p class="section-sub">Tell us where to deliver your materials.</p>

    <div class="cart-layout">
      <form class="checkout-card" id="checkout-form" novalidate>
        <h3>1. Contact details</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full name</label>
            <input id="name" name="name" placeholder="Jane Wanjiku">
            <span class="error-msg"></span>
          </div>
          <div class="form-group">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" placeholder="07XX XXX XXX">
            <span class="error-msg"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com">
          <span class="error-msg"></span>
        </div>

        <h3>2. Delivery address</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="county">County</label>
            <select id="county" name="county">
              <option value="">Select county</option>
              <option>Nairobi</option>
              <option>Kiambu</option>
              <option>Machakos</option>
              <option>Kajiado</option>
              <option>Nakuru</option>
              <option>Mombasa</option>
              <option>Kisumu</option>
            </select>
            <span class="error-msg"></span>
          </div>
          <div class="form-group">
            <label for="town">Town / Area</label>
            <input id="town" name="town" placeholder="e.g. Kitengela">
            <span class="error-msg"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="address">Site directions</label>
          <textarea id="address" name="address" rows="3" placeholder="Landmarks, road name, plot number..."></textarea>
          <span class="error-msg"></span>
        </div>

        <h3>3. Payment method</h3>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="payment" value="M-Pesa" checked>
            <div><strong>M-Pesa</strong><br><small>You'll receive an STK push on your phone</small></div>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Cash on Delivery">
            <div><strong>Cash on Delivery</strong><br><small>Pay when materials arrive on site</small></div>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Bank Transfer">
            <div><strong>Bank Transfer</strong><br><small>Details sent to your email</small></div>
          </label>
        </div>

        <button type="submit" class="btn btn-block">Place Order</button>
      </form>

      <aside class="summary" id="order-summary"></aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    const summary = getCartSummary();

    if (summary.items.length === 0) location.href = "cart.html";

    document.getElementById("order-summary").innerHTML = `
      <h3>Your Order</h3>
      ${summary.items.map((i) => `
        <div class="mini-item"><span>${escapeHTML(i.name)} (Qty: ${i.qty})</span><span>${formatPrice(i.price * i.qty)}</span></div>`).join("")}
      <div class="summary-row" style="margin-top:10px"><span>Subtotal</span><span>${formatPrice(summary.subtotal)}</span></div>
      <div class="summary-row"><span>Delivery</span><span>${summary.delivery === 0 ? "FREE" : formatPrice(summary.delivery)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${formatPrice(summary.total)}</span></div>
      <a href="cart.html" class="btn-link" style="color:var(--primary)">Edit cart</a>`;

    // Form validation
    const rules = {
      name: (v) => v.trim().length >= 3 || "Please enter your full name",
      phone: (v) => /^(?:\+?254|0)[17]\d{8}$/.test(v.replace(/\s/g, "")) || "Enter a valid Kenyan phone number",
      email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || "Enter a valid email address",
      county: (v) => v !== "" || "Please select a county",
      town: (v) => v.trim() !== "" || "Please enter your town or area",
      address: (v) => v.trim().length >= 10 || "Give us a bit more detail so the driver can find you",
    };

    function validateField(input) {
      const result = rules[input.name](input.value);
      const errorEl = input.parentElement.querySelector(".error-msg");
      const ok = result === true;
      input.classList.toggle("input-error", !ok);
      errorEl.textContent = ok ? "" : result;
      return ok;
    }

    const form = document.getElementById("checkout-form");
    Object.keys(rules).forEach((name) => {
      form.elements[name].addEventListener("blur", (e) => validateField(e.target));
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const allValid = Object.keys(rules).map((n) => validateField(form.elements[n])).every(Boolean);
      if (!allValid) {
        showToast("Please fix the highlighted fields", "error");
        return;
      }

      const data = Object.fromEntries(new FormData(form));
      const order = {
        id: "BLD-" + Date.now().toString().slice(-6),
        date: new Date().toISOString(),
        customer: data,
        items: summary.items.map(({ id, name, price, qty }) => ({ id, name, price, qty })),
        total: summary.total,
      };

      // Save the order
      const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
      orders.push(order);
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      clearCart();

      document.getElementById("checkout-page").innerHTML = `
        <div class="success-box">
          <h2>Order placed successfully!</h2>
          <p>Thank you, ${escapeHTML(data.name.split(" ")[0])}. Your order has been received.</p>
          <div class="order-id">Order #${order.id}</div>
          <p>Total: <strong>${formatPrice(order.total)}</strong> via ${escapeHTML(data.payment)}</p>
          <p style="color:var(--gray); margin:12px 0 24px">
            We'll call you on ${escapeHTML(data.phone)} to confirm the delivery time to ${escapeHTML(data.town)}, ${escapeHTML(data.county)}.
          </p>
          <a href="shop.html" class="btn">Continue Shopping</a>
        </div>`;
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
