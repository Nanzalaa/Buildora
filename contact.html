<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Nanzalaa">
  <title>Contact - Buildora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Contact Us</h1>
        <p>Need a quote or help estimating quantities? We're here to help.</p>
      </div>
    </div>

    <section class="section container">
      <div class="two-col" style="align-items:start">
        <form class="checkout-card" id="contact-form">
          <h3>Send us a message</h3>
          <div class="form-group">
            <label for="c-name">Name</label>
            <input id="c-name" required>
          </div>
          <div class="form-group">
            <label for="c-email">Email</label>
            <input id="c-email" type="email" required>
          </div>
          <div class="form-group">
            <label for="c-subject">Subject</label>
            <select id="c-subject">
              <option>General enquiry</option>
              <option>Request a quote</option>
              <option>Order support</option>
              <option>Contractor account</option>
            </select>
          </div>
          <div class="form-group">
            <label for="c-message">Message</label>
            <textarea id="c-message" rows="5" required></textarea>
          </div>
          <button class="btn btn-block" type="submit">Send Message</button>
        </form>

        <div class="contact-info">
          <div><strong>Showroom</strong><p>Mombasa Road, Nairobi</p></div>
          <div><strong>Phone / WhatsApp</strong><p>+254 700 000 000</p></div>
          <div><strong>Email</strong><p>hello@buildora.co.ke</p></div>
          <div><strong>Opening hours</strong><p>Monday to Friday: 7:30am to 6:00pm<br>Saturday: 8:00am to 4:00pm<br>Sunday: Closed</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      e.target.reset();
      showToast("Message sent! We'll get back to you within 24 hours.");
    });
  </script>
</body>
</html>
