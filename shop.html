<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Buildora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Shop Materials</h1>
        <p>Browse our full range of building materials and hardware.</p>
      </div>
    </div>

    <section class="section container">
      <div class="shop-layout">
        <aside class="sidebar">
          <h3>Categories</h3>
          <ul class="filter-list" id="category-filters"></ul>

          <h3>Price range (KSh)</h3>
          <div class="price-inputs">
            <input type="number" id="min-price" placeholder="Min" min="0">
            <input type="number" id="max-price" placeholder="Max" min="0">
          </div>

          <h3>Availability</h3>
          <label><input type="checkbox" id="in-stock"> In stock only</label>
        </aside>

        <div>
          <div class="shop-toolbar">
            <span class="result-count" id="result-count"></span>
            <div style="display:flex; gap:8px; flex-wrap:wrap">
              <input type="search" id="search" placeholder="Search products..." aria-label="Search products">
              <select id="sort" aria-label="Sort products">
                <option value="default">Sort: Recommended</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
              </select>
            </div>
          </div>
          <div class="product-grid" id="product-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const state = {
      category: params.get("category") || "all",
      search: params.get("q") || "",
      sort: "default",
      min: null,
      max: null,
      inStock: false,
    };

    const searchInput = document.getElementById("search");
    searchInput.value = state.search;

    function renderCategoryFilters() {
      const all = [{ id: "all", name: "All Products" }, ...CATEGORIES];
      document.getElementById("category-filters").innerHTML = all.map((c) => `
        <li><button class="${state.category === c.id ? "active" : ""}" data-cat="${c.id}">${c.name}</button></li>`).join("");
    }

    function getFilteredProducts() {
      const term = state.search.trim().toLowerCase();
      let list = PRODUCTS.filter((p) => {
        if (state.category !== "all" && p.category !== state.category) return false;
        if (term && !(p.name.toLowerCase().includes(term) || p.description.toLowerCase().includes(term))) return false;
        if (state.min !== null && p.price < state.min) return false;
        if (state.max !== null && p.price > state.max) return false;
        if (state.inStock && p.stock <= 0) return false;
        return true;
      });

      const sorters = {
        "price-asc": (a, b) => a.price - b.price,
        "price-desc": (a, b) => b.price - a.price,
        name: (a, b) => a.name.localeCompare(b.name),
      };
      if (sorters[state.sort]) list = [...list].sort(sorters[state.sort]);
      return list;
    }

    function renderProducts() {
      const list = getFilteredProducts();
      document.getElementById("result-count").textContent =
        `Showing ${list.length} product${list.length === 1 ? "" : "s"}`;

      document.getElementById("product-grid").innerHTML = list.length
        ? list.map(productCard).join("")
        : `<div class="empty-state" style="grid-column:1/-1">
             <p>No products match your filters.</p>
             <button class="btn" onclick="resetFilters()">Clear filters</button>
           </div>`;
    }

    function resetFilters() {
      Object.assign(state, { category: "all", search: "", min: null, max: null, inStock: false });
      searchInput.value = "";
      document.getElementById("min-price").value = "";
      document.getElementById("max-price").value = "";
      document.getElementById("in-stock").checked = false;
      renderCategoryFilters();
      renderProducts();
    }

    // Event listeners
    document.getElementById("category-filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      state.category = btn.dataset.cat;
      renderCategoryFilters();
      renderProducts();
    });
    searchInput.addEventListener("input", (e) => { state.search = e.target.value; renderProducts(); });
    document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderProducts(); });
    document.getElementById("min-price").addEventListener("input", (e) => {
      state.min = e.target.value === "" ? null : Number(e.target.value); renderProducts();
    });
    document.getElementById("max-price").addEventListener("input", (e) => {
      state.max = e.target.value === "" ? null : Number(e.target.value); renderProducts();
    });
    document.getElementById("in-stock").addEventListener("change", (e) => { state.inStock = e.target.checked; renderProducts(); });

    renderCategoryFilters();
    renderProducts();
  </script>
</body>
</html>
